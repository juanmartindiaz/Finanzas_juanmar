name: APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true

      - name: Restaurar la firma de depuración
        run: |
          if [ -z "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Falta el secreto DEBUG_KEYSTORE_BASE64 (ver docs/ACTUALIZACIONES.md)"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"

      - name: Dependencias Flutter
        working-directory: app
        run: flutter pub get

      - name: Compilar APK
        working-directory: app
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          BASE_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          BUILD_NAME="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          echo "versionCode=$VERSION_CODE versionName=$BUILD_NAME"
          flutter build apk --debug \
            --build-name="$BUILD_NAME" \
            --build-number="$VERSION_CODE"
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-debug.apk \
             "../dist/gestor-finanzas-${GITHUB_RUN_NUMBER}.apk"

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gestor Finanzas build ${{ github.run_number }}
          body: |
            APK de desarrollo firmado con la llave de depuración del proyecto.

            - Commit: `${{ github.sha }}`
            - versionCode: `${{ github.run_number }}` + 1000
            - Instalar encima de la versión anterior (misma firma; no borra datos).
            Descarga el APK o usa Obtainium para actualizar.
          files: dist/gestor-finanzas-${{ github.run_number }}.apk
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
